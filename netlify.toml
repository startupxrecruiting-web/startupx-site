# Netlify config. Static site, no build step.

[build]
  publish = "."
  command = ""

# ── Redirects ────────────────────────────────────────────────────────
# www → apex (canonical host)
[[redirects]]
  from = "https://www.startupxrecruiting.com/*"
  to = "https://startupxrecruiting.com/:splat"
  status = 301
  force = true

# Default Netlify subdomain → apex, so only one hostname is ever indexed
[[redirects]]
  from = "https://startupx-site.netlify.app/*"
  to = "https://startupxrecruiting.com/:splat"
  status = 301
  force = true

# Clean URLs: /page.html → /page.
# Netlify already serves /talent from talent.html.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/talent.html"
  to = "/talent"
  status = 301
  force = true

[[redirects]]
  from = "/intake.html"
  to = "/intake"
  status = 301
  force = true

# ── Security headers ─────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.doubleclick.net; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.doubleclick.net https://formspree.io; form-action 'self' https://formspree.io; frame-src https://calendar.google.com https://calendar.app.google https://airtable.com https://*.airtable.com; manifest-src 'self'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
